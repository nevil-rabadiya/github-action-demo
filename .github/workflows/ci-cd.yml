name: CI/CD Pipeline - Build, Test, Deploy

# Define when this workflow should run
on:
  push:
    branches:
      - dev  # Trigger on pushes to dev branch
  pull_request:
    branches:
      - dev  # Trigger on pull requests to dev branch

# Environment variables shared across all jobs
env:
  NODE_VERSION: '18.x'  # Node.js version to use

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest  # Run on Ubuntu Linux virtual machine
    
    steps:
      # Step 1: Checkout the repository code
      # fetch-depth: 0 gets full git history (useful for versioning)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Node.js environment
      # Uses the version specified in env.NODE_VERSION
      # cache: 'npm' speeds up subsequent runs by caching npm dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Step 3: Install dependencies
      # npm ci (Clean Install) is faster and more reliable than npm install
      # It uses package-lock.json for exact dependency versions
      - name: Install dependencies
        run: npm ci

      # Step 4: Run code linting
      # Checks code style and catches potential errors
      - name: Run linting
        run: npm run lint

      # Step 5: Build TypeScript code
      # Compiles .ts files to .js files in the dist/ directory
      - name: Build TypeScript
        run: npm run build

      # Step 6: Upload build artifacts
      # Saves the compiled dist/ folder for use in test and deploy jobs
      # retention-days: 7 keeps artifacts for 7 days before automatic deletion
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 7

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build  # This job only runs after 'build' job completes successfully
    
    steps:
      # Step 1: Checkout code
      # Need code for test files and package.json
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Step 3: Install dependencies
      # Need both production and dev dependencies for testing
      - name: Install dependencies
        run: npm ci

      # Step 4: Download build artifacts
      # Gets the compiled code from the build job
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      # Step 5: Run tests
      # Executes the test suite using Jest
      # If tests fail, the workflow stops and deployment won't happen
      - name: Run tests
        run: npm test

      # Step 6: Display test results
      - name: Test Summary
        if: always()  # Run this step even if tests fail
        run: echo "Test execution completed"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test]  # Only run after both build AND test jobs succeed
    # Only deploy on push events to dev branch (not on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    
    steps:
      # Step 1: Checkout code      
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Download build artifacts
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      # Step 3: Verify downloaded files
      - name: Verify downloaded files
        run: |
          echo "Verifying dist directory:"
          ls -la dist/

      # Step 4: Deploy to EC2
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Create SSH key file from GitHub secret
          echo "$EC2_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          
          # Create deployment package with compiled code and dependencies
          tar -czf deploy.tar.gz dist/ package.json package-lock.json
          
          # Copy deployment package to EC2 server
          scp -i ec2_key.pem -o StrictHostKeyChecking=no deploy.tar.gz $EC2_USER@$EC2_HOST:/tmp/
          
          # Execute deployment commands on EC2 server
          ssh -i ec2_key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'ENDSSH'
            cd /var/www/github-actions-demo
            
            # Backup current version before deploying new one
            if [ -d "current" ]; then
              mv current backup_$(date +%Y%m%d_%H%M%S)
            fi
            
            # Extract new version
            mkdir -p current
            tar -xzf /tmp/deploy.tar.gz -C current/
            cd current
            
            # Install only production dependencies (no dev dependencies)
            npm ci --production
            
            # Restart application using PM2 process manager
            # PM2 keeps the app running and auto-restarts on failure
            pm2 restart github-actions-demo || pm2 start dist/index.js --name github-actions-demo
            
            # Clean up temporary files
            rm /tmp/deploy.tar.gz
          ENDSSH
          
          # Clean up local SSH key file
          rm ec2_key.pem

      # Step 5: Verify deployment
      # Health check to ensure the deployed application is responding
      - name: Verify Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Wait 5 seconds for application to start
          sleep 5
          # Check if health endpoint responds successfully
          curl -f http://$EC2_HOST:3000/health || exit 1

      # Step 6: Deployment success notification
      - name: Deployment Success
        run: echo "🚀 Deployment completed successfully!"

